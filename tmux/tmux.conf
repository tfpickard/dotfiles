# =============================================================================
# tmux.conf — State of the Art Configuration (2026)
# =============================================================================
# Requirements: tmux >= 3.4, tpm, true color terminal
# Install: ln -sf ~/.config/tmux/tmux.conf ~/.tmux.conf
#          git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#          tmux source ~/.tmux.conf && ~/.tmux/plugins/tpm/bin/install_plugins
# =============================================================================

# -----------------------------------------------------------------------------
# Core Settings
# -----------------------------------------------------------------------------

# Modern terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",*:Tc"

# Enable extended keys (CSI u) for proper modifier handling in vim
set -g extended-keys on
set -as terminal-features ',*:extkeys'

# Address vim mode switching delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 100000

# Enable focus events for vim autoread
set -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Aggressive resize - resize to smallest client viewing
setw -g aggressive-resize on

# Enable mouse support
set -g mouse on

# Monitor activity without being annoying
setw -g monitor-activity on
set -g visual-activity off

# Use system clipboard
set -g set-clipboard on

# Update status more frequently
set -g status-interval 5

# -----------------------------------------------------------------------------
# Prefix Configuration
# -----------------------------------------------------------------------------

# Primary prefix: C-a (screen muscle memory, easier reach than C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Secondary prefix for nested sessions: C-s
set -g prefix2 C-s
bind C-s send-prefix -2

# -----------------------------------------------------------------------------
# Nested Session Support
# -----------------------------------------------------------------------------
# When SSHed into a remote tmux, press F12 to toggle "off" mode
# This passes all keys through to the inner tmux session

# Indicator colors for nested mode
color_nested_off="#ff5555"
color_nested_indicator="#50fa7b"

# Toggle nested mode with F12
bind -T root F12 \
    set prefix None \;\
    set prefix2 None \;\
    set key-table off \;\
    set status-style "bg=$color_nested_off" \;\
    set window-status-current-style "bg=$color_nested_off" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u prefix2 \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u window-status-current-style \;\
    refresh-client -S

# Visual indicator in status bar when in nested mode
# (Handled via status-right, see theme section)

# -----------------------------------------------------------------------------
# Vim-Style Navigation
# -----------------------------------------------------------------------------

# Vi mode for copy
setw -g mode-keys vi

# Vi-style pane selection (works with vim-tmux-navigator plugin)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Enter copy mode with prefix + v
bind v copy-mode

# Paste with prefix + p
bind p paste-buffer
bind P choose-buffer

# -----------------------------------------------------------------------------
# Window & Pane Management
# -----------------------------------------------------------------------------

# Intuitive split bindings (preserving current path)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Quick pane cycling
bind Tab last-pane
bind BTab last-window

# Zoom toggle (already z, but also add prefix + Enter for convenience)
bind Enter resize-pane -Z
bind z resize-pane -Z

# Synchronize panes toggle
bind S setw synchronize-panes \; display "Sync: #{?pane_synchronized,ON,OFF}"

# Rotate panes
bind -r C-o rotate-window

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Break pane to new window
bind ! break-pane

# Join pane from another window
bind @ command-prompt -p "join pane from:" "join-pane -s '%%'"

# -----------------------------------------------------------------------------
# Session Management
# -----------------------------------------------------------------------------

# Quick session switching
bind s choose-tree -Zs
bind w choose-tree -Zw

# Create new session
bind N command-prompt -p "new session:" "new-session -s '%%'"

# Kill session
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

# Rename session/window
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# -----------------------------------------------------------------------------
# Client Cycling (for multiple attached clients)
# -----------------------------------------------------------------------------

# Cycle through clients
bind C-n switch-client -n
bind C-p switch-client -p

# List clients
bind C-l list-clients

# Detach other clients
bind D detach-client -a

# -----------------------------------------------------------------------------
# Session Logging
# -----------------------------------------------------------------------------

# Log output directory
TMUX_LOG_DIR="$HOME/.tmux/logs"

# Toggle logging for current pane
bind P pipe-pane -o "exec cat >> $HOME/.tmux/logs/tmux-#S-#W-#P-$(date +%Y%m%d-%H%M%S).log" \; display "Logging: #{?pane_pipe,ON,OFF}"

# -----------------------------------------------------------------------------
# Utility Bindings
# -----------------------------------------------------------------------------

# Reload config
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"

# Edit config
bind e new-window -n "tmux.conf" "nvim ~/.tmux.conf"

# Clear screen and history
bind C-k send-keys -R \; clear-history \; display "Cleared"

# Toggle status bar
bind b set status

# URL view (requires urlview or extract_url)
bind u capture-pane -J \; save-buffer /tmp/tmux-buffer \; delete-buffer \; split-window -l 10 "urlview /tmp/tmux-buffer || cat /tmp/tmux-buffer | grep -oE 'https?://[^ ]+' | fzf --bind 'enter:execute(open {})+abort'"

# -----------------------------------------------------------------------------
# Environment Detection
# -----------------------------------------------------------------------------

# SSH session detection (used in status bar)
%if "#{SSH_CONNECTION}"
    set -g status-position top
    set -g @ssh_session 1
%else
    set -g status-position bottom
    set -g @ssh_session 0
%endif

# -----------------------------------------------------------------------------
# Theme: Catppuccin Mocha with Customizations
# -----------------------------------------------------------------------------

# Using catppuccin colors
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"
thm_lavender="#b4befe"

# Pane borders
set -g pane-border-style "fg=$thm_gray"
set -g pane-active-border-style "fg=$thm_blue"

# Message styling
set -g message-style "fg=$thm_cyan,bg=$thm_gray"
set -g message-command-style "fg=$thm_cyan,bg=$thm_gray"

# Mode styling (copy mode, etc)
setw -g mode-style "fg=$thm_pink,bg=$thm_black4,bold"

# Clock
setw -g clock-mode-colour "$thm_blue"

# -----------------------------------------------------------------------------
# Status Bar
# -----------------------------------------------------------------------------

set -g status on
set -g status-justify left
set -g status-style "fg=$thm_fg,bg=$thm_bg"

# Left status: Session + Nested indicator + Prefix indicator
set -g status-left-length 100
set -g status-left "\
#[fg=$thm_bg,bg=$thm_blue,bold] #S \
#[fg=$thm_blue,bg=$thm_gray]\
#{?client_prefix,#[fg=$thm_gray]#[bg=$thm_yellow]#[fg=$thm_bg]#[bold] PREFIX #[fg=$thm_yellow]#[bg=$thm_gray],}\
#{?key-table,#[fg=$thm_gray]#[bg=$thm_red]#[fg=$thm_bg]#[bold] NESTED #[fg=$thm_red]#[bg=$thm_bg],#[fg=$thm_gray,bg=$thm_bg]}\
 "

# Right status: Git + SSH + Host + CPU + Time
set -g status-right-length 200
set -g status-right "\
#{?@ssh_session,#[fg=$thm_orange]#[bg=$thm_bg]#[fg=$thm_bg]#[bg=$thm_orange]#[bold]  SSH #[fg=$thm_gray]#[bg=$thm_orange]#[fg=$thm_orange]#[bg=$thm_gray],#[fg=$thm_gray,bg=$thm_bg]}\
#[fg=$thm_fg,bg=$thm_gray] #h \
#[fg=$thm_blue,bg=$thm_gray]\
#[fg=$thm_bg,bg=$thm_blue] %H:%M \
#[fg=$thm_lavender,bg=$thm_blue]\
#[fg=$thm_bg,bg=$thm_lavender] %Y-%m-%d "

# Window status
set -g window-status-format "\
#[fg=$thm_bg,bg=$thm_black4] #I \
#[fg=$thm_fg,bg=$thm_gray] #W#{?window_zoomed_flag,  ,} "

set -g window-status-current-format "\
#[fg=$thm_bg,bg=$thm_magenta,bold] #I \
#[fg=$thm_fg,bg=$thm_gray,bold] #W#{?window_zoomed_flag,  ,} "

set -g window-status-separator ""

# Activity style
setw -g window-status-activity-style "fg=$thm_yellow,bg=$thm_gray"

# -----------------------------------------------------------------------------
# Plugins (via TPM)
# -----------------------------------------------------------------------------

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Vim-tmux seamless navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Enhanced copy/paste
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Regex search in copy mode
set -g @plugin 'tmux-plugins/tmux-copycat'

# URL opening
set -g @plugin 'tmux-plugins/tmux-open'

# FZF integration for sessions, windows, panes
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_ORDER="session|window|pane|command|keybinding"

# Quick finger-based selection (like vimium hints)
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key F
set -g @fingers-pattern-0 '[0-9a-f]{7,40}'
set -g @fingers-pattern-1 '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

# Session logging
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "$HOME/.tmux/logs"
set -g @screen-capture-path "$HOME/.tmux/logs"
set -g @save-complete-history-path "$HOME/.tmux/logs"

# Which-key style popup for discoverability
set -g @plugin 'alexwforsythe/tmux-which-key'

# Prefix highlight in status bar (backup to manual config)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'

# CPU/Memory info
set -g @plugin 'tmux-plugins/tmux-cpu'

# -----------------------------------------------------------------------------
# Conditional Configuration
# -----------------------------------------------------------------------------

# macOS specific
%if "#{==:#{host},Darwin}"
    # Use reattach-to-user-namespace for clipboard
    set -g default-command "reattach-to-user-namespace -l $SHELL"
%endif

# -----------------------------------------------------------------------------
# Local Overrides
# -----------------------------------------------------------------------------

# Source local config if exists (for machine-specific settings)
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

# -----------------------------------------------------------------------------
# Initialize TPM (keep this line at the very bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
