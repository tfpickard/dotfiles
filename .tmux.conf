# ============================================================================
# TMUX Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings (Sensible Defaults - Explicit)
# ----------------------------------------------------------------------------

# Use C-a as prefix instead of C-b (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window and pane numbering at 1 (0 is too far from 1-9)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar more frequently
set -g status-interval 5

# Enable mouse support
set -g mouse on

# Enable focus events (useful for vim)
set -g focus-events on

# Upgrade $TERM
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Address vim mode switching delay
set -s escape-time 0

# Super useful when using multiple monitors
setw -g aggressive-resize on

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity off

# ----------------------------------------------------------------------------
# Key Bindings
# ----------------------------------------------------------------------------

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Easy pane navigation with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Enable vi mode for copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ----------------------------------------------------------------------------
# Plugin Manager (TPM) Setup
# ----------------------------------------------------------------------------

# TPM Installation Path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------

# TPM - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# tmux-whichkey - Key binding manager and helper
set -g @plugin 'alexwforsythe/tmux-whichkey'

# PowerKit - Beautiful status bar theming
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'
set -g @powerkit_plugins 'datetime,weather,battery,cpu,memory,disk,network,git,cloud,kubernetes,wifi,bluetooth,vpn,audiodevices,nowplaying,camera,smartkey'

# tmux-resurrect - Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum - Automatic session save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank - Better copy/paste integration
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

# tmux-open - Open highlighted files/URLs
set -g @plugin 'tmux-plugins/tmux-open'

# tmux-copycat - Better search in tmux
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-pain-control - Better pane control
set -g @plugin 'tmux-plugins/tmux-pain-control'

# tmux-sessionist - Better session management
set -g @plugin 'tmux-plugins/tmux-sessionist'

# tmux-fzf - Fuzzy finder integration
set -g @plugin 'sainnhe/tmux-fzf'
set -g @tmux-fzf-launch-key 'C-f'

# vim-tmux-navigator - Seamless vim/tmux navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# ----------------------------------------------------------------------------
# Initialize TPM (Keep this line at the very bottom)
# ----------------------------------------------------------------------------

# Install TPM if not already installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
